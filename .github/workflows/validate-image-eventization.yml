name: Validate Image Eventization V1

on:
  push:
    branches:
      - feat/image-eventization-v1
  workflow_dispatch:

jobs:
  baseline-main-face:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Main baseline lifestyle action and face
        id: main_face
        continue-on-error: true
        run: npm run validate:lifestyle-action-face

      - name: Report main baseline result
        run: echo "main_face_outcome=${{ steps.main_face.outcome }}"

  branch-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout eventization branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Branch lifestyle action and face
        id: branch_face
        continue-on-error: true
        run: npm run validate:lifestyle-action-face

      - name: Validate telephoto action macro
        run: npm run validate:telephoto-action-macro

      - name: Validate prompt compiler
        run: npm run validate:prompt-compiler

      - name: Validate prompt audit
        run: npm run validate:prompt-audit

      - name: Build
        run: npm run build

      - name: Report branch face result
        run: echo "branch_face_outcome=${{ steps.branch_face.outcome }}"
