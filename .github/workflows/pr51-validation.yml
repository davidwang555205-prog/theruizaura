name: PR51 validation

on:
  push:
    branches:
      - codex/lifestyle-visual-diversity-v1-1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate actions
        run: npm run validate:actions
      - name: Validate lifestyle taxonomy
        run: npm run validate:lifestyle-taxonomy
      - name: Validate lifestyle action and face
        run: npm run validate:lifestyle-action-face
      - name: Validate production runtime
        run: npm run validate:production-runtime
